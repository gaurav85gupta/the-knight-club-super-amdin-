<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coupons — The Knight Club Super Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
  <link rel="stylesheet" href="../assets/css/courses.css" />
  <link rel="stylesheet" href="../assets/css/coupons.css" />
  <style>html.auth-pending body { visibility: hidden; }</style>
  <script>document.documentElement.classList.add('auth-pending');</script>
  <noscript><style>html.auth-pending body { visibility: visible; }</style></noscript>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">The <span>Knight Club</span></div>
      <nav aria-label="Admin modules">
        <a href="../index.html">Dashboard</a>
        <a href="courses.html">Courses</a>
        <a href="categories.html">Categories</a>
        <a href="instructors.html">Instructors</a>
        <a href="students.html">Students</a>
        <a href="enrollments.html">Enrollments</a>
        <a href="orders.html">Orders</a>
        <a href="leads.html">Leads</a>
        <span class="nav-disabled" aria-disabled="true">Payments</span>
        <a href="coupons.html" class="active" aria-current="page">Coupons</a>
        <a href="analytics.html">Analytics</a>
        <a href="membership.html">1% Club</a>
        <a href="placeholders.html">Placeholders</a>
        <a href="settings.html">Settings</a>
      </nav>
    </aside>

    <main class="main-content" id="main-content" tabindex="-1">
      <div class="topbar">
        <span></span>
        <div class="topbar-right">
          <span id="admin-identity" class="admin-identity"></span>
          <button type="button" id="logout-btn" class="btn btn-outline btn-sm">Sign out</button>
        </div>
      </div>

      <div class="page-head">
        <h1>Coupons</h1>
        <a href="coupon-form.html" class="btn btn-primary btn-sm">New coupon</a>
      </div>

      <div id="page-alert" class="alert" role="alert" tabindex="-1" hidden></div>

      <div class="card">
        <div class="filters filters-coupons" role="search">
          <input class="input" id="f-search" type="search" placeholder="Search coupon code…" maxlength="40" aria-label="Search coupons by code" />
          <select class="input" id="f-status" aria-label="Filter by state">
            <option value="">All states</option>
            <option value="ACTIVE">Active</option>
            <option value="INACTIVE">Inactive</option>
            <option value="SCHEDULED">Scheduled</option>
            <option value="EXPIRED">Expired</option>
            <option value="USAGE_LIMIT_REACHED">Usage limit reached</option>
          </select>
          <select class="input" id="f-discount-type" aria-label="Filter by discount type">
            <option value="">All discount types</option>
            <option value="PERCENTAGE">Percentage</option>
            <option value="FIXED">Fixed amount</option>
          </select>
          <select class="input" id="f-scope" aria-label="Filter by scope">
            <option value="">Global &amp; course-specific</option>
            <option value="GLOBAL">Global only</option>
            <option value="COURSE_SPECIFIC">Course-specific only</option>
          </select>
          <button type="button" id="f-reset" class="btn btn-outline btn-sm">Reset filters</button>
        </div>
        <div class="filters" style="grid-template-columns: 1fr auto; margin-bottom: var(--space-4);">
          <select class="input" id="f-sort" aria-label="Sort coupons" style="max-width: 14rem;">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="code">Code (A–Z)</option>
            <option value="usage">Most used</option>
            <option value="expiry">Expiring soon</option>
          </select>
          <span></span>
        </div>

        <div class="table-wrap">
          <table class="table" id="coupons-table" aria-busy="false">
            <thead>
              <tr>
                <th scope="col">Code</th>
                <th scope="col">Discount</th>
                <th scope="col">State</th>
                <th scope="col">Usage</th>
                <th scope="col">Valid dates</th>
                <th scope="col">Scope</th>
                <th scope="col">Created</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="coupons-body"></tbody>
          </table>
        </div>
        <div id="state-box" class="state-box" hidden></div>

        <div class="pager" id="pager" hidden>
          <span id="pager-info"></span>
          <div class="pager-buttons">
            <button type="button" id="prev-btn" class="btn btn-outline btn-sm">Previous</button>
            <span id="pager-page"></span>
            <button type="button" id="next-btn" class="btn btn-outline btn-sm">Next</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/dom.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/coupon-api.js"></script>
  <script src="../assets/js/coupons-list.js"></script>
</body>
</html>
