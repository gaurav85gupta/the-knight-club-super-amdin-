<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Courses — The Knight Club Super Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css?v=p3" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
  <link rel="stylesheet" href="../assets/css/courses.css?v=p4" />
  <style>html.auth-pending body { visibility: hidden; }</style>
  <script>document.documentElement.classList.add('auth-pending');</script>
  <noscript><style>html.auth-pending body { visibility: visible; }</style></noscript>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="app-shell">
    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <aside class="sidebar" id="sidebar-nav">
      <div class="brand">The <span>Knight Club</span></div>
      <nav aria-label="Admin modules">
        <a href="../index.html">Dashboard</a>
        <a href="courses.html" class="active" aria-current="page">Courses</a>
        <a href="categories.html">Categories</a>
        <a href="instructors.html">Instructors</a>
        <a href="testimonials.html">Testimonials</a>
        <a href="students.html">Students</a>
        <a href="enrollments.html">Enrollments</a>
        <a href="orders.html">Orders</a>
        <a href="leads.html">Leads</a>
        <a href="members.html">Membership</a>
        <a href="coupons.html">Coupons</a>
        <a href="analytics.html">Analytics</a>
        <a href="placeholders.html">Placeholders</a>
        <a href="settings.html">Settings</a>
      </nav>
    </aside>

    <main class="main-content listing-page" id="main-content" tabindex="-1">
      <div class="topbar">
        <div class="topbar-left"><button type="button" id="menu-toggle" class="menu-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar-nav"><span class="menu-toggle-icon" aria-hidden="true"></span></button><span></span></div>
        <div class="topbar-right">
          <span id="admin-identity" class="admin-identity"></span>
          <button type="button" id="logout-btn" class="btn btn-outline btn-sm">Sign out</button>
        </div>
      </div>

      <div class="page-head">
        <h1>Courses</h1>
        <a href="course-form.html" class="btn btn-primary btn-sm">New course</a>
      </div>

      <div id="page-alert" class="alert" role="alert" tabindex="-1" hidden></div>

      <div class="card">
        <div class="filters" role="search">
          <input class="input" id="f-search" type="search" placeholder="Search title or slug…" maxlength="100" aria-label="Search courses by title or slug" />
          <select class="input" id="f-status" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option value="DRAFT">Draft</option>
            <option value="PUBLISHED">Published</option>
            <option value="ARCHIVED">Archived</option>
          </select>
          <select class="input" id="f-visibility" aria-label="Filter by visibility">
            <option value="">All visibility</option>
            <option value="PUBLIC">Public</option>
            <option value="PRIVATE">Private</option>
          </select>
          <select class="input" id="f-category" aria-label="Filter by category"><option value="">All categories</option></select>
          <select class="input" id="f-instructor" aria-label="Filter by instructor"><option value="">All instructors</option></select>
        </div>
        <div class="filters" style="grid-template-columns: 1fr auto; margin-bottom: var(--space-4);">
          <select class="input" id="f-sort" aria-label="Sort courses" style="max-width: 14rem;">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="updated">Recently updated</option>
            <option value="title">Title (A–Z)</option>
          </select>
          <button type="button" id="f-reset" class="btn btn-outline btn-sm">Reset filters</button>
        </div>

        <div class="table-wrap">
          <table class="table" id="courses-table" aria-busy="false">
            <thead>
              <tr>
                <th scope="col">Course</th>
                <th scope="col">Category</th>
                <th scope="col" data-col="tertiary">Instructor</th>
                <th scope="col">Price</th>
                <th scope="col">Status</th>
                <th scope="col" data-col="secondary">Visibility</th>
                <th scope="col" data-col="secondary">Created</th>
                <th scope="col" data-col="secondary">Updated</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="courses-body"></tbody>
          </table>
        </div>
        <div id="state-box" class="state-box" hidden></div>

        <div class="pager" id="pager" hidden>
          <span id="pager-info"></span>
          <div class="pager-buttons">
            <button type="button" id="prev-btn" class="btn btn-outline btn-sm">Previous</button>
            <span id="pager-page"></span>
            <button type="button" id="next-btn" class="btn btn-outline btn-sm">Next</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/dom.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/courses-api.js"></script>
  <script src="../assets/js/catalog-api.js"></script>
  <script src="../assets/js/courses-list.js"></script>
</body>
</html>
