<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Membership — The Knight Club Super Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
  <link rel="stylesheet" href="../assets/css/courses.css" />
  <link rel="stylesheet" href="../assets/css/coupons.css" />
  <link rel="stylesheet" href="../assets/css/orders.css" />
  <style>html.auth-pending body { visibility: hidden; }</style>
  <script>document.documentElement.classList.add('auth-pending');</script>
  <noscript><style>html.auth-pending body { visibility: visible; }</style></noscript>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">The <span>Knight Club</span></div>
      <nav aria-label="Admin modules">
        <a href="../index.html">Dashboard</a>
        <a href="courses.html">Courses</a>
        <a href="categories.html">Categories</a>
        <a href="instructors.html">Instructors</a>
        <a href="testimonials.html">Testimonials</a>
        <a href="students.html">Students</a>
        <a href="enrollments.html">Enrollments</a>
        <a href="orders.html">Orders</a>
        <a href="leads.html">Leads</a>
        <a href="members.html" class="active" aria-current="page">Membership</a>
        <a href="coupons.html">Coupons</a>
        <a href="analytics.html">Analytics</a>
        <a href="placeholders.html">Placeholders</a>
        <a href="settings.html">Settings</a>
      </nav>
    </aside>

    <main class="main-content" id="main-content" tabindex="-1">
      <div class="topbar">
        <span></span>
        <div class="topbar-right">
          <span id="admin-identity" class="admin-identity"></span>
          <button type="button" id="logout-btn" class="btn btn-outline btn-sm">Sign out</button>
        </div>
      </div>

      <div class="page-head">
        <h1>Membership</h1>
      </div>

      <nav class="section-tabs" aria-label="Membership sections">
        <a href="members.html" class="active" aria-current="page">Members</a>
        <a href="membership.html">Plan settings</a>
      </nav>

      <div id="page-alert" class="alert" role="alert" tabindex="-1" hidden></div>

      <div class="order-totals-grid" id="totals-grid" hidden></div>

      <div class="card">
        <div class="filters filters-orders" role="search">
          <input class="input" id="f-search" type="search" placeholder="Search student name, user ID, mobile or order number…" maxlength="80" aria-label="Search members" />
          <select class="input" id="f-status" aria-label="Filter by order status">
            <option value="PAID">Paid members</option>
            <option value="PENDING">Pending payment</option>
            <option value="FAILED">Failed</option>
            <option value="CANCELLED">Cancelled</option>
            <option value="ALL">All membership orders</option>
          </select>
          <button type="button" id="f-reset" class="btn btn-outline btn-sm">Reset filters</button>
        </div>

        <div class="table-wrap">
          <table class="table" id="members-table" aria-busy="false">
            <thead>
              <tr>
                <th scope="col">Student</th>
                <th scope="col">Order</th>
                <th scope="col">Plan</th>
                <th scope="col">Selected courses</th>
                <th scope="col">Amount</th>
                <th scope="col">Status</th>
                <th scope="col">Purchased</th>
                <th scope="col"></th>
              </tr>
            </thead>
            <tbody id="members-body"></tbody>
          </table>
        </div>
        <div id="state-box" class="state-box" hidden></div>

        <div class="pager" id="pager" hidden>
          <span id="pager-info"></span>
          <div class="pager-buttons">
            <button type="button" id="prev-btn" class="btn btn-outline btn-sm">Previous</button>
            <span id="pager-page"></span>
            <button type="button" id="next-btn" class="btn btn-outline btn-sm">Next</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/forms.js"></script>
  <script src="../assets/js/dom.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/members-api.js"></script>
  <script src="../assets/js/members-list.js"></script>
</body>
</html>
